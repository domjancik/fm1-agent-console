<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FM-1 Simulator</title>
<style>
  :root {
    --bg: #15171a; --panel: #23262b; --edge: #3a3e45; --text: #e6e6e6; --muted: #8a8f98;
    --led-off: #2a2c30; --led-glow: #6b4a1e; --led-full: #ffb347;
    --white-key: #e9e9e4; --black-key: #1b1c1f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; max-width: 1400px; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  .device { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; overflow-x: auto; }
  .top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  canvas#lcd { width: 480px; height: 480px; image-rendering: pixelated; background: #000; border: 6px solid #0b0c0d; border-radius: 6px; }
  .controls { display: flex; flex-direction: column; gap: 14px; }
  .group-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .buttons { display: grid; grid-template-columns: repeat(7, 58px); gap: 8px; }
  .btn { position: relative; height: 44px; border-radius: 6px; border: 1px solid var(--edge); background: #2e3238; color: var(--text);
         font: 600 11px ui-sans-serif, system-ui; cursor: pointer; user-select: none; padding-top: 14px; }
  .btn.pressed, .key.pressed { filter: brightness(0.8); transform: translateY(1px); }
  .btn .led { position: absolute; top: 6px; left: 50%; width: 14px; height: 5px; margin-left: -7px; border-radius: 3px; }
  .btn .hint { position: absolute; right: 4px; bottom: 2px; font-size: 9px; color: var(--muted); font-weight: 400; }
  .led-off { background: var(--led-off); }
  .led-glow { background: var(--led-glow); }
  .led-full { background: var(--led-full); box-shadow: 0 0 8px var(--led-full); }
  .encoders { display: grid; grid-template-columns: repeat(7, 58px); gap: 8px; }
  .enc { display: flex; flex-direction: column; align-items: center; gap: 4px; user-select: none; }
  .knob { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #555a62, #2a2d32);
          border: 1px solid var(--edge); position: relative; cursor: ns-resize; touch-action: none; }
  .knob::after { content: ""; position: absolute; left: 50%; top: 4px; width: 3px; height: 12px; margin-left: -1.5px; background: #ddd; border-radius: 2px;
                 transform-origin: 1.5px 18px; transform: rotate(var(--angle, 0deg)); }
  .enc label { font-size: 10px; color: var(--muted); }
  .master { display: flex; align-items: center; gap: 10px; }
  .master input { width: 200px; }
  .keyboard { position: relative; height: 130px; margin-top: 18px; }
  .key { position: absolute; top: 0; border: 1px solid #000; border-radius: 0 0 5px 5px; cursor: pointer; user-select: none; touch-action: none;
         display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; font-size: 9px; }
  .key.white { width: 34px; height: 128px; background: var(--white-key); color: #333; z-index: 1; }
  .key.black { width: 22px; height: 80px; background: var(--black-key); color: #aaa; z-index: 2; }
  .key .led { width: 60%; height: 6px; border-radius: 3px; margin-bottom: auto; margin-top: 6px; }
  .key.white .led { margin-top: 86px; margin-bottom: 2px; }
  .key .lbl { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .key .hint { color: #888; }
  aside { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 32px); }
  .conn { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); }
  .conn b { color: var(--text); }
  #log { flex: 1; overflow-y: auto; font: 11px/1.45 ui-monospace, Menlo, monospace; background: #111316; border-radius: 6px; padding: 6px; min-height: 200px; }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .rx { color: #8fc7ff; } #log .tx { color: #ffcf8f; } #log .err { color: #ff7a7a; }
  .help { color: var(--muted); font-size: 11px; margin-top: 12px; }
  kbd { background: #33373d; border-radius: 3px; padding: 0 4px; font-size: 10px; }
</style>
</head>
<body>
<main>
  <section class="device" aria-label="Virtual FM-1">
    <div class="top">
      <canvas id="lcd" width="480" height="480" aria-label="LCD"></canvas>
      <div class="controls">
        <div><div class="group-title">Buttons</div><div class="buttons" id="buttons"></div></div>
        <div><div class="group-title">Encoders (drag or scroll)</div><div class="encoders" id="encoders"></div></div>
        <div class="master"><span class="group-title">Master</span><input type="range" id="master" min="0" max="1023" value="0" /><span id="masterVal">0</span></div>
      </div>
    </div>
    <div class="keyboard" id="keyboard"></div>
    <p class="help">
      Keys: <kbd>1</kbd>-<kbd>0</kbd>, <kbd>q</kbd>-<kbd>p</kbd> (no e), <kbd>a</kbd>-<kbd>;</kbd> (no g/h).
      <kbd>space</kbd> hold REC, <kbd>enter</kbd> SAVE, <kbd>esc</kbd> FX, <kbd>h</kbd>/<kbd>e</kbd>/<kbd>g</kbd> HOME/EDIT/GLO,
      <kbd>-</kbd>/<kbd>=</kbd> OCT, <kbd>z</kbd> ENV, <kbd>x</kbd> PLAY, <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> SELECT, <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> ALGORITHM.
    </p>
  </section>
  <aside aria-label="Protocol log">
    <div class="conn"><span>UI link: <b id="ws">connecting</b></span><span>Device: <b id="phase">-</b></span></div>
    <label class="help"><input type="checkbox" id="hideNoise" checked /> hide HEARTBEAT / ACK</label>
    <div id="log"></div>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
